<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lisa loom | Admin | Mario Kapakodu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">&#128062; Mario Kapakodu &ndash; Admin</a>
      <a class="btn btn-outline-light btn-sm" href="../login.html">Logi välja</a>
    </div>
  </header>
  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 bg-secondary-subtle py-3 admin-sidebar">
        <ul class="nav nav-pills flex-column bg-dark rounded p-2">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Töölaud</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="animals.html">Loomad</a></li>
          <li class="nav-item"><a class="nav-link active" href="animal_add.html">Lisa uus loom</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="../index.html">Vaata avalehte</a></li>
        </ul>
      </aside>
      <main class="col-md-9 col-lg-10 py-4 px-md-4">

        <h1>Lisa / muuda looma</h1>
        <form action="#" method="post" enctype="multipart/form-data" class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Nimi</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="col-md-6">
            <label for="species" class="form-label">Liik</label>
            <select class="form-select" id="species" name="species" required>
              <option value="">Vali liik</option>
              <option>Koer</option>
              <option>Kass</option>
              <option>Muu</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="sex" class="form-label">Sugu</label>
            <select class="form-select" id="sex" name="sex" required>
              <option value="">Vali sugu</option>
              <option>Isane</option>
              <option>Emane</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="age" class="form-label">Vanus (aastates)</label>
            <input type="number" class="form-control" id="age" name="age" min="0" max="30" step="0.5">
          </div>
          <div class="col-md-4">
            <label for="status" class="form-label">Staatus</label>
            <select class="form-select" id="status" name="status">
              <option>Otsib kodu</option>
              <option>Broneeritud</option>
              <option>Ravil</option>
            </select>
          </div>
          <div class="col-12">
            <label for="description" class="form-label">Kirjeldus</label>
            <textarea class="form-control" id="description" name="description" rows="5"></textarea>
          </div>
          <div class="col-12">
            <label for="image" class="form-label">Pilt</label>
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-success">Salvesta</button>
            <a href="animals.html" class="btn btn-outline-secondary">Tühista</a>
          </div>
        </form>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
